[package]
name = "cosmic-capture"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Unified screenshot, video, and GIF capture for the COSMIC desktop"
license = "MIT"
repository = "https://github.com/techgeek1/cosmic-capture"

[[bin]]
name = "cosmic-capture"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Errors / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "fs", "time"] }
futures-util = "0.3"

# xdg-desktop-portal client — only ScreenCast (PipeWire source) now;
# Screenshot path captures via wlr-screencopy directly via cosmic-client-toolkit.
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }

# Wayland layer-shell overlay for the region selector (B path), and the
# screencopy client used by our screenshot pipeline.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"] }
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols", rev = "160b086" }
rustix = { version = "0.38", features = ["event", "fs"] }
memmap2 = "0.9"

# GBM + DRM fourcc constants. Used by the dmabuf-backed screencopy path:
# we allocate a GPU buffer object through GBM, hand its fd to cosmic-comp
# via linux-dmabuf-v1, and feed the same fd downstream to gst's vapostproc
# for zero-copy recording. Mesa/Intel/AMD all expose libgbm; NVIDIA does
# too on recent drivers.
gbm = "0.18"
drm-fourcc = "2.2"

# PNG encode + Wayland clipboard for the screenshot output paths.
png = "0.17"
# Wallpaper decode for the window picker backdrop (off the render thread).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
wl-clipboard-rs = "0.9"

# COSMIC theme — used to pull the user's accent color for the selector border.
cosmic-config = { git = "https://github.com/pop-os/libcosmic" }
cosmic-theme = { git = "https://github.com/pop-os/libcosmic" }
# COSMIC background config — read by the window picker to paint each
# output's wallpaper (Path or gradient/solid Color) as the picker
# backdrop, matching xdg-desktop-portal-cosmic's screenshot UI.
cosmic-bg-config = { git = "https://github.com/pop-os/cosmic-bg" }

# COSMIC GUI toolkit — for the pre-flight panel / HUD.
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = ["tokio", "wayland", "winit", "wgpu", "multi-window", "desktop", "dbus-config"] }

# GStreamer pipeline: appsrc/pipewiresrc + encoders + appsink. We feed
# raw RGBA frames into appsrc ourselves via pipewire-rs so the recording
# path doesn't depend on gst-plugin-pipewire, which has a known
# gst_caps_is_fixed (pwsrc->caps) assertion on cosmic-comp's screencast.
gstreamer = "0.23"
gstreamer-app = "0.23"
# `v1_24` unlocks `VideoInfoDmaDrm` / `dma_drm_fourcc_from_format` etc. —
# the canonical API for building `format=DMA_DRM, drm-format=…` caps
# from a fourcc + modifier pair. Host gstreamer on the user's machine
# is 1.28, well past the 1.24 minimum the feature gates.
gstreamer-video = { version = "0.23", features = ["v1_24"] }
# DmaBufAllocator: wraps an OwnedFd into a GstMemory tagged `memory:DMABuf`,
# letting downstream `vapostproc`/`vacompositor` import the GPU buffer
# zero-copy instead of falling back to a sysmem download.
gstreamer-allocators = "0.23"

# Direct PipeWire stream consumption. We connect to the node id the
# screencast portal hands us as a consumer (Direction::Input), pump
# buffers out of the stream's process callback, and forward them to a
# gst appsrc with pre-fixed caps — sidestepping the assertion entirely.
pipewire = "0.9"
libspa = "0.9"
libspa-sys = "0.9"

# GIF encoding
gifski = { version = "1.32", default-features = false }
imgref = "1.10"
rgb = "0.8"

# Notifications
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Misc
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"

# Compile wgpu/naga and related shader-handling crates with full
# optimisations even in dev builds. Without this, iced's first frame
# blocks for ~11s in `cargo run` while wgpu's shader pipeline finishes
# (no internal events while it's working → every Task::perform message
# — FrozenFrameReady, WindowsForOutputReady, …— sits in iced's queue
# until that first frame renders). Release builds aren't affected.
[profile.dev.package.wgpu]
opt-level = 3
[profile.dev.package.wgpu-core]
opt-level = 3
[profile.dev.package.wgpu-hal]
opt-level = 3
[profile.dev.package.wgpu-types]
opt-level = 3
[profile.dev.package.naga]
opt-level = 3
